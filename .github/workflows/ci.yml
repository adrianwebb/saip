name: CI

on:
  push:
    branches: [main, staging, 'feature/*', 'fix/*']
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Typecheck & build shared
        run: pnpm --filter @saip/shared build

      - name: Test shared
        run: pnpm --filter @saip/shared test

      - name: Typecheck & build inference
        run: pnpm --filter @saip/inference build

      - name: Test inference
        run: pnpm --filter @saip/inference test
