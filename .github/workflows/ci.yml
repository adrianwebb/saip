name: CI

on:
  push:
    branches: [main, staging, 'feature/*', 'fix/*']
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Typecheck & build shared
        run: pnpm --filter @saip/shared build

      - name: Test shared
        run: pnpm --filter @saip/shared test

      - name: Typecheck & build inference
        run: pnpm --filter @saip/inference build

      - name: Test inference
        run: pnpm --filter @saip/inference test

      - name: Typecheck & build training
        run: pnpm --filter @saip/training build

      - name: Test training
        run: pnpm --filter @saip/training test

      - name: Typecheck & build cli
        run: pnpm --filter @saip/cli build

      - name: Test cli
        run: pnpm --filter @saip/cli test
      # Acceptance smoke gate. The rungs above build and unit-test the parts, which is exactly
      # what stayed green while `saip` could not be executed at all (#70) and while a documented
      # ${VAR} interpolation was implemented nowhere. This runs the assembled artifact and fails
      # on the silent-success signature: exit 0 with empty output.
      - name: Smoke test the built CLI
        run: |
          set -euo pipefail
          # Launch through PATH, the way a user does. `node cli/dist/index.js` was tried first
          # and is worthless here: it resolves argv[1] to the real file, so it passes even with
          # the #70 entry-guard bug reintroduced (verified). The symlink is what gives this gate
          # its teeth.
          # Install through the same script users run, rather than hard-coding an entry path here.
          # The previous version pinned `cli/dist/index.js`, so when the executable moved to
          # `dist/bin.js` (#101) this step exec'd a library as a shell script — the path existed in
          # two places and only one was updated. One source of truth, and this step now also proves
          # the installer works.
          pnpm --filter @saip/cli install:local
          PNPM_BIN=$(pnpm bin -g 2>/dev/null || true)
          export PATH="${PNPM_BIN:-$HOME/.local/bin}:$HOME/.local/bin:$HOME/.local/share/pnpm/bin:$PATH"
          command -v saip >/dev/null || { echo "::error::install:local did not put saip on PATH"; exit 1; }

          OUT=$(saip --version)
          test -n "$OUT" || { echo "::error::saip --version produced no output (silent no-op: the #70 symptom)"; exit 1; }
          echo "version: $OUT"

          saip --help | grep -q "profiles" || { echo "::error::profiles command not wired into the CLI"; exit 1; }
          saip --help | grep -q "config"   || { echo "::error::config command not wired into the CLI"; exit 1; }

          # On a GPU-less runner profiles must FAIL CLOSED with a named reason and exit 2, never
          # invent a tier and never hang.
          set +e
          PROFILES_OUT=$(saip profiles --json 2>&1)
          CODE=$?
          set -e
          echo "profiles exit=$CODE"
          test -n "$PROFILES_OUT" || { echo "::error::saip profiles produced no output"; exit 1; }
          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 2 ]; then
            echo "::error::saip profiles exited $CODE (expected 0 with a GPU, 2 when none is present)"; exit 1
          fi

          # config doctor must always describe its state, including having no store.
          saip config doctor | grep -qi "secret store" \
            || { echo "::error::saip config doctor did not report store state"; exit 1; }
          echo "smoke: assembled CLI executes and reports"
