name: Documentation Site

on:
  push:
    branches: [main, staging, 'feature/*', 'fix/*']
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  pull_request:
    branches: [staging, main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build documentation site (astro + context packs + link check)
        run: cd docs && pnpm build

      - name: Verify context packs exist
        run: |
          test -s docs/dist/context-pack/saip-docs.xml
          test -s docs/dist/context-pack/saip-docs.md
          test -s docs/dist/context-pack/saip-docs.json
          echo "✅ All three context packs present"

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # After the site is live, re-check its links AS URLS against the deployed origin. This is the only
  # rung that can see the #123 failure class: `/tutorials/getting-started/` and
  # `/saip/tutorials/getting-started/` map to the same file on disk, so the build-time check passed while
  # GitHub Pages returned 404. Running it post-deploy turns a user-reported 404 into a red job.
  verify-live:
    name: Verify deployed links
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Build (the checker reads the built page set)
        run: cd docs && pnpm build
      - name: Check every internal link against the live site
        run: cd docs && node scripts/check-links.mjs dist --origin=https://adrianwebb.github.io
      - name: Spot-check the pages the maintainer reported 404ing
        run: |
          set -euo pipefail
          for u in \
            "https://adrianwebb.github.io/saip/" \
            "https://adrianwebb.github.io/saip/tutorials/getting-started/" \
            "https://adrianwebb.github.io/saip/guides/deploy-local/" \
            "https://adrianwebb.github.io/saip/reference/configuration/" \
            "https://adrianwebb.github.io/saip/explanation/architecture/" ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L "$u")
            test "$code" = "200" || { echo "::error::$u returned $code"; exit 1; }
            echo "200  $u"
          done
