# JSON Schema for saip.yaml
#
# NORMATIVE SHAPE of the platform config. It is NOT enforced as a whole document: the
# runtime validators live in @saip/shared and cover specific sections —
#   - adapters/users   -> AdapterRegistryService (shared/src/services.ts)
#   - hosts.yaml       -> HostRegistryService   (shared/src/services.ts)
#   - profile/profiles -> ProfileService        (added by #53)
# A whole-document JSON-Schema validator (shared/src/config-schema.ts) does not exist;
# earlier revisions of this header claimed it did. Do not restate that claim.
#
# NOTE: additionalProperties is false below, so any new top-level key (e.g. `profiles`)
# must be added to `properties` at the same time it is implemented, or the file will
# describe a config that the schema rejects.

$schema: "https://json-schema.org/draft/2020-12/schema"
title: SAIP Platform Configuration
type: object
required: [platform, model, storage]
additionalProperties: false

properties:
  platform:
    type: object
    required: [name, version]
    properties:
      name:
        type: string
        const: saip
      version:
        type: string
        pattern: "^\\d+\\.\\d+\\.\\d+"

  model:
    type: object
    required: [base]
    properties:
      base:
        type: string
        description: HuggingFace model ID (reference: QuantTrio/Qwen3.5-4B-AWQ)
      revision:
        type: string
        description: Commit hash pinning the checkpoint (recorded in the adapter manifest)
      quantization:
        type: string
        enum: [awq, gptq, bitsandbytes, none]
        default: awq
        description: >-
          Must match a checkpoint already quantized in this format; vLLM cannot AWQ-quantize
          a BF16 checkpoint at load time. bitsandbytes is not a supported multi-LoRA path.
      max_model_len:
        type: integer
        minimum: 1024
        description: >-
          Optional override. Normally owned by the active profile, since the safe ceiling
          depends on the card (24576 at the 8 GB tier, 65536 at 12 GB).
      dtype:
        type: string
        enum: [float16, bfloat16, float32, auto]
        default: auto
        description: bfloat16 requires compute capability 8.0 or newer
      language_model_only:
        type: boolean
        default: true
        description: Skip the vision encoder (~0.6 GiB). Disables image/video inputs.
      kv_cache_dtype:
        type: string
        enum: [auto, float16, bfloat16, fp8, fp8_e4m3, fp8_e5m2, int8_per_token_head]
        default: auto
        description: >-
          fp8* and int8_per_token_head require compute capability 8.9+; below that
          ProfileService rejects them (int8 is accepted by vLLM but silently corrupts
          output on Ampere).

  # --- Service profiles (hardware contract; enforced by ProfileService) ---
  profile:
    type: string
    description: >-
      Name of the active entry in `profiles`. Omit to auto-resolve from a GPU probe to the
      highest tier the card satisfies; fails with exit code 2 if none fits.

  profiles:
    type: object
    description: Named service profiles, one per supported hardware tier.
    minProperties: 1
    additionalProperties:
      type: object
      required: [min_vram_gib, min_capability, vram_ceiling_gib, engine]
      additionalProperties: false
      properties:
        description:
          type: string
        min_vram_gib:
          type: integer
          minimum: 4
          description: Total VRAM the card must have
        min_capability:
          type: number
          description: Minimum NVIDIA compute capability (7.5 / 8.0 / 8.9)
        vram_ceiling_gib:
          type: number
          exclusiveMinimum: 0
          description: >-
            Hard budget for the vLLM process. gpu_memory_utilization is DERIVED from this
            (ceiling / total VRAM) and checked against measured free memory at launch.
            Never a constant.
        engine:
          type: object
          additionalProperties: false
          properties:
            max_model_len:
              type: integer
              minimum: 1024
            kv_cache_dtype:
              type: string
              enum: [auto, float16, bfloat16, fp8, fp8_e4m3, fp8_e5m2, int8_per_token_head]
            enforce_eager:
              type: boolean
            enable_lora:
              type: boolean
            max_loras:
              type: integer
              minimum: 1
            max_lora_rank:
              type: integer
              minimum: 1
            language_model_only:
              type: boolean
        training:
          type: object
          description: Present only on tiers that can fine-tune locally.
          additionalProperties: false
          properties:
            precision:
              type: string
              enum: [bf16, fp16]
            sequence_len:
              type: integer
              minimum: 256
            gradient_checkpointing:
              type: boolean
            optimizer:
              type: string
              enum: [adamw_bnb_8bit, adamw_torch_4bit, adamw_torch]

  adapter:
    type: object
    properties:
      default_rank:
        type: integer
        minimum: 1
        default: 16
      default_alpha:
        type: integer
        minimum: 1
        default: 32
      target_modules:
        type: array
        items:
          type: string
        default: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
        description: >-
          Default covers the 8 full-attention layers and all MLPs. Qwen3.5 additionally
          exposes gated-deltanet projections (in_proj_qkvz, in_proj_ba — 24 of 32 layers)
          as LoRA-addressable; targeting them is opt-in, not the default.

  storage:
    type: object
    required: [r2]
    properties:
      r2:
        type: object
        required: [bucket, endpoint]
        properties:
          bucket:
            type: string
            description: R2 bucket name (supports ${ENV_VAR} interpolation)
          endpoint:
            type: string
            description: R2 S3-compatible endpoint URL
      huggingface:
        type: object
        properties:
          token_env:
            type: string
            description: Environment variable name containing HF token
            default: SAIP_HF_TOKEN

  users:
    type: array
    items:
      type: object
      required: [id, adapters]
      properties:
        id:
          type: string
        adapters:
          type: object
          properties:
            inference:
              type: string
              description: Adapter alias for inference (e.g., northstar-architect@latest). May reference any adapter in the registry, including composites.
            training:
              type: string
              description: Adapter name for training output (leaf adapters only; composites are derived, not trained directly)

  # ─── Adapter Registry ──────────────────────────────────────
  # Adapters are first-class definitions independent of users. Each is either
  # a trainable leaf (with strategy + data-scope linkage) or a composite built
  # from weighted components that version on independent cadences.
  adapters:
    type: array
    items:
      type: object
      required: [name, scope]
      oneOf:
        - required: [training]     # leaf adapters declare a training linkage
        - required: [composite]    # composites declare component weights
      properties:
        name:
          type: string
          description: Unique adapter name; referenced by users and composites
        scope:
          type: string
          enum: [global, domain, project, user]
          description: Visibility/ownership boundary for reuse rules
        project:
          type: string
          description: Required when scope is 'project'
        user:
          type: string
          description: Optional owner annotation when scope is 'user'
        description:
          type: string
        trainable:
          type: boolean
          default: true
          description: False for purely-derived adapters without their own training runs
        base:
          type: string
          description: Base model this adapter targets (must match all components when compiling)
        training:
          type: object
          description: Training linkage — how this adapter learns (leaf adapters)
          required: [strategy, data_scopes]
          properties:
            strategy:
              type: string
              description: Registered training strategy plugin name (knowledge_embedding, corrective_sft, weighted_kto, …)
            data_scopes:
              type: array
              items:
                type: string
              description: Data types (from the Data API registry) that feed this adapter's training (documents, sessions, feedback, …)
            params:
              type: object
              description: Strategy-specific defaults for jobs targeting this adapter
              additionalProperties: true
        composite:
          type: object
          description: Composition spec — merged offline into a single vLLM artifact
          required: [components]
          properties:
            gain:
              type: number
              default: 1.0
              description: Overall λ applied to the merged delta (evaluated hyperparameter, not arbitrary)
            merge:
              type: string
              enum: [weighted_linear, ties, dare]
              default: weighted_linear
              description: PEFT merge algorithm for combining component deltas
            components:
              type: array
              minItems: 2
              items:
                type: object
                required: [adapter, weight]
                properties:
                  adapter:
                    type: string
                    description: Component adapter name (no cycles allowed)
                  weight:
                    type: number
                    minimum: 0
                    description: Per-component composition weight wᵢ
                  version:
                    type: string
                    description: Optional version pin (e.g. '@000012'); default @latest resolved at compile time

  inference:
    type: object
    properties:
      port:
        type: integer
        default: 8000
      gpu_node:
        type: string
        default: local
      max_loras:
        type: integer
        minimum: 1
        default: 4
      max_cpu_loras:
        type: integer
        minimum: 1
        default: 32
      systemone:
        type: object
        properties:
          enabled:
            type: boolean
            default: true

  training:
    type: object
    properties:
      port:
        type: integer
        default: 8001
      gpu_node:
        type: string
        default: local
      methods:
        type: object
        properties:
          knowledge_embedding:
            type: object
            properties:
              enabled:
                type: boolean
                default: true
              sequence_len:
                type: integer
                default: 4096
          corrective_sft:
            type: object
            properties:
              enabled:
                type: boolean
                default: true
              sequence_len:
                type: integer
                default: 4096
          weighted_kto:
            type: object
            properties:
              enabled:
                type: boolean
                default: true
              reward_range:
                type: array
                items:
                  type: integer
                minItems: 2
                maxItems: 2
                default: [-3, 3]
              magnitude_weights:
                type: object
                additionalProperties:
                  type: number

  plugins:
    type: array
    items:
      type: object
    default: []

  security:
    type: object
    description: Pluggable authentication config. Fail-closed unless dev_mode or tokens configured.
    properties:
      dev_mode:
        type: boolean
        default: false
        description: When true, all API/UI requests authenticate as 'dev'. Never the default.
      api_tokens:
        type: array
        default: []
        description: Caller→bearer-token mappings; values resolved from named secrets, never stored here.
        items:
          type: object
          required: [caller, token_secret]
          properties:
            caller:
              type: string
            token_secret:
              type: string
              description: Name of the secret holding this caller's token value.
      ui:
        type: object
        properties:
          admin_secret:
            type: string
            description: Name of the secret guarding web UI access.
