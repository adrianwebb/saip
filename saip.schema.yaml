# JSON Schema for saip.yaml
# Used by shared/src/config-schema.ts for runtime validation

$schema: "https://json-schema.org/draft/2020-12/schema"
title: SAIP Platform Configuration
type: object
required: [platform, model, storage]
additionalProperties: false

properties:
  platform:
    type: object
    required: [name, version]
    properties:
      name:
        type: string
        const: saip
      version:
        type: string
        pattern: "^\\d+\\.\\d+\\.\\d+"

  model:
    type: object
    required: [base]
    properties:
      base:
        type: string
        description: HuggingFace model ID
      quantization:
        type: string
        enum: [awq, gptq, bitsandbytes, none]
        default: awq
      max_model_len:
        type: integer
        minimum: 1024
        default: 65536
      dtype:
        type: string
        enum: [float16, bfloat16, float32]
        default: float16

  adapter:
    type: object
    properties:
      default_rank:
        type: integer
        minimum: 1
        default: 16
      default_alpha:
        type: integer
        minimum: 1
        default: 32
      target_modules:
        type: array
        items:
          type: string
        default: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

  storage:
    type: object
    required: [r2]
    properties:
      r2:
        type: object
        required: [bucket, endpoint]
        properties:
          bucket:
            type: string
            description: R2 bucket name (supports ${ENV_VAR} interpolation)
          endpoint:
            type: string
            description: R2 S3-compatible endpoint URL
      huggingface:
        type: object
        properties:
          token_env:
            type: string
            description: Environment variable name containing HF token
            default: SAIP_HF_TOKEN

  users:
    type: array
    items:
      type: object
      required: [id, adapters]
      properties:
        id:
          type: string
        adapters:
          type: object
          properties:
            inference:
              type: string
              description: Adapter alias for inference (e.g., northstar-architect@latest). May reference any adapter in the registry, including composites.
            training:
              type: string
              description: Adapter name for training output (leaf adapters only; composites are derived, not trained directly)

  # ─── Adapter Registry ──────────────────────────────────────
  # Adapters are first-class definitions independent of users. Each is either
  # a trainable leaf (with strategy + data-scope linkage) or a composite built
  # from weighted components that version on independent cadences.
  adapters:
    type: array
    items:
      type: object
      required: [name, scope]
      oneOf:
        - required: [training]     # leaf adapters declare a training linkage
        - required: [composite]    # composites declare component weights
      properties:
        name:
          type: string
          description: Unique adapter name; referenced by users and composites
        scope:
          type: string
          enum: [global, domain, project, user]
          description: Visibility/ownership boundary for reuse rules
        project:
          type: string
          description: Required when scope is 'project'
        user:
          type: string
          description: Optional owner annotation when scope is 'user'
        description:
          type: string
        trainable:
          type: boolean
          default: true
          description: False for purely-derived adapters without their own training runs
        base:
          type: string
          description: Base model this adapter targets (must match all components when compiling)
        training:
          type: object
          description: Training linkage — how this adapter learns (leaf adapters)
          required: [strategy, data_scopes]
          properties:
            strategy:
              type: string
              description: Registered training strategy plugin name (knowledge_embedding, corrective_sft, weighted_kto, …)
            data_scopes:
              type: array
              items:
                type: string
              description: Data types (from the Data API registry) that feed this adapter's training (documents, sessions, feedback, …)
            params:
              type: object
              description: Strategy-specific defaults for jobs targeting this adapter
              additionalProperties: true
        composite:
          type: object
          description: Composition spec — merged offline into a single vLLM artifact
          required: [components]
          properties:
            gain:
              type: number
              default: 1.0
              description: Overall λ applied to the merged delta (evaluated hyperparameter, not arbitrary)
            merge:
              type: string
              enum: [weighted_linear, ties, dare]
              default: weighted_linear
              description: PEFT merge algorithm for combining component deltas
            components:
              type: array
              minItems: 2
              items:
                type: object
                required: [adapter, weight]
                properties:
                  adapter:
                    type: string
                    description: Component adapter name (no cycles allowed)
                  weight:
                    type: number
                    minimum: 0
                    description: Per-component composition weight wᵢ
                  version:
                    type: string
                    description: Optional version pin (e.g. '@000012'); default @latest resolved at compile time

  inference:
    type: object
    properties:
      port:
        type: integer
        default: 8000
      gpu_node:
        type: string
        default: local
      max_loras:
        type: integer
        minimum: 1
        default: 4
      max_cpu_loras:
        type: integer
        minimum: 1
        default: 32
      systemone:
        type: object
        properties:
          enabled:
            type: boolean
            default: true

  training:
    type: object
    properties:
      port:
        type: integer
        default: 8001
      gpu_node:
        type: string
        default: local
      methods:
        type: object
        properties:
          knowledge_embedding:
            type: object
            properties:
              enabled:
                type: boolean
                default: true
              sequence_len:
                type: integer
                default: 4096
          corrective_sft:
            type: object
            properties:
              enabled:
                type: boolean
                default: true
              sequence_len:
                type: integer
                default: 4096
          weighted_kto:
            type: object
            properties:
              enabled:
                type: boolean
                default: true
              reward_range:
                type: array
                items:
                  type: integer
                minItems: 2
                maxItems: 2
                default: [-3, 3]
              magnitude_weights:
                type: object
                additionalProperties:
                  type: number

  plugins:
    type: array
    items:
      type: object
    default: []
