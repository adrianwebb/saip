# SAIP Inference Gateway stack
#
# Usage:
#   1. Render engine args for THIS host's GPU (required — see note below):
#        npx tsx inference/scripts/generate-engine-args.ts
#      or: saip awake  (the CLI runs this for you)
#   2. Start the stack:
#        docker compose -f inference/docker-compose.yml up -d
#   3. Watch the engine come up (cold model load is ~2 min):
#        docker compose -f inference/docker-compose.yml logs -f vllm
#
# Why the args are generated rather than written here:
#   --gpu-memory-utilization is a fraction of the card's TOTAL memory, and startup aborts if
#   FREE memory at launch is below that product. A constant committed to this file is wrong
#   on every card except the one it was tuned for, and unusable on a desktop-shared GPU.
#   It is derived from the active service profile against measured memory — see
#   docs/src/content/docs/reference/hardware-profiles.mdx.

services:
  inference-api:
    build:
      context: ..
      dockerfile: inference/Dockerfile
    ports:
      - "${SAIP_INFERENCE_PORT:-8000}:8000"
    env_file:
      - ../.env
    volumes:
      - ../saip.yaml:/app/saip.yaml:ro
      - adapter-cache:/app/adapters
    environment:
      # Reach the engine by service name on the compose network.
      SAIP_VLLM_BASE_URL: http://vllm:8000/v1
    depends_on:
      vllm:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  vllm:
    build:
      context: ..
      dockerfile: inference/vllm.Dockerfile
    image: saip-vllm:v0.31.0
    # Host port is configurable: 8080 is commonly claimed by other local services, and the
    # gateway itself listens on 8000, so the engine must not fight for it.
    ports:
      - "${SAIP_VLLM_PORT:-8081}:8000"
    env_file:
      - ../.env
      - ./.engine-args.env
    volumes:
      - model-cache:/root/.cache/huggingface
      - adapter-cache:/adapters
    environment:
      # Runtime LoRA loading lets the gateway swap adapters without a restart. The engine
      # only accepts adapters whose contents it supports: no DoRA vectors, no
      # embed_tokens / lm_head modules — the compiler must not emit those.
      VLLM_ALLOW_RUNTIME_LORA_UPDATING: "True"
      HF_HUB_OFFLINE: "${SAIP_HF_OFFLINE:-0}"
    shm_size: "2gb"
    healthcheck:
      # Cold load includes torch.compile plus CUDA-graph capture; 120s is too short for a
      # first boot on a laptop GPU.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 60
      start_period: 300s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  model-cache:
    name: saip-model-cache
  adapter-cache:
    name: saip-adapter-cache
