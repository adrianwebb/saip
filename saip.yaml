# SAIP Platform Configuration
# This file is committed to the repo. Secrets go in .env (never committed).
# Schema: saip.schema.yaml

platform:
  name: saip
  version: "0.1.0"

# Base model configuration.
# `base` must name a checkpoint ALREADY quantized in `quantization` — vLLM cannot AWQ-quantize
# a BF16 repo at load time. There is no official Qwen AWQ build of this model, so the
# reference checkpoint is the community QuantTrio build, pinned by revision.
# Hardware-dependent knobs (max_model_len, kv dtype, eager/graphs) belong to the active
# profile below, not here; see docs/src/content/docs/reference/hardware-profiles.mdx.
model:
  base: "QuantTrio/Qwen3.5-4B-AWQ"
  revision: "32c292e3a73afe1138518180b1b6d2868c980ee2"
  quantization: "awq"
  dtype: "auto"
  language_model_only: true
  kv_cache_dtype: "auto"

# Service profiles — the hardware contract. Omit `profile` to auto-resolve against the
# probed GPU; resolution FAILS CLOSED (exit 2) when no tier fits rather than letting the
# engine OOM later. `gpu_memory_utilization` is derived from vram_ceiling_gib over the
# card's TOTAL memory and gated on measured FREE memory, so it is never set here.
#
# Deliberately NOT pinned: hard-coding a tier here would cap a 16 GB dev machine at the
# 8 GB tier forever. Pin it only to hold a machine down on purpose (CI, a shared GPU, or
# reproducing a report), or pass `--profile` for a single run.
# profile: inference-8gb

profiles:
  # Measured on an RTX 3080 Laptop (SM 8.6): 6,988 MiB peak, coherent generation,
  # working tool calls, 4 LoRA slots loaded.
  inference-8gb:
    description: "Serve only; 8 GB consumer GPU. CUDA graphs unaffordable (~2.65 GiB)."
    min_vram_gib: 8
    min_capability: 7.5
    vram_ceiling_gib: 7.0
    engine:
      max_model_len: 24576
      kv_cache_dtype: auto
      language_model_only: true
      enforce_eager: true
      enable_lora: true
      max_loras: 4
      max_lora_rank: 16
  # Same card serves and trains, time-shared via awake/sleep — never concurrently.
  # bf16 LoRA is the documented path: 4-bit QLoRA on Qwen3.5 is discouraged upstream.
  full-loop-12gb:
    description: "Serve and fine-tune locally; 12 GB card (Ampere or newer)."
    min_vram_gib: 12
    min_capability: 8.0
    vram_ceiling_gib: 11.0
    engine:
      max_model_len: 65536
      kv_cache_dtype: auto
      language_model_only: true
      enforce_eager: false
      # Measured on an RTX 3080 Laptop: with CUDA graphs on and 65,536 context, the memory
      # budget holds 236 Mamba cache blocks, and vLLM refuses to start when its default
      # max_num_seqs (256) exceeds that. Every sequence pins one fixed-size delta-net block
      # (48 MiB here) regardless of length — this is the concurrency cost of hybrid
      # attention, enforced at boot.
      max_num_seqs: 128
      enable_lora: true
      max_loras: 4
      max_lora_rank: 16
    training:
      precision: bf16
      sequence_len: 2048
      gradient_checkpointing: true
      optimizer: adamw_bnb_8bit

# LoRA / adapter defaults
adapter:
  default_rank: 16
  default_alpha: 32
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

# Remote storage
storage:
  # `:-` with an empty default means "supplied at deploy time; unset loads as empty".
  # Config therefore stays readable offline (`saip profiles`, `status`, tests), while the R2
  # storage provider refuses to initialise on an empty value and names the variable. Strict
  # `${VAR}` here would make every command demand cloud credentials just to load a file.
  r2:
    bucket: "${SAIP_R2_BUCKET:-}"
    endpoint: "${SAIP_R2_ENDPOINT:-}"
    # Credentials are referenced by NAME only and resolved by the secrets layer, never
    # interpolated into this file: SAIP_R2_ACCESS_KEY_ID, SAIP_R2_SECRET_ACCESS_KEY
  huggingface:
    token_env: "SAIP_HF_TOKEN"

# Adapter registry — first-class adapter definitions, independent of users.
# Leaf adapters declare training linkage (strategy + data scopes); composites
# merge weighted components into a single compiled artifact for vLLM.
adapters:
  # General-purpose components with independent training cadences
  - name: general
    scope: global
    description: "Baseline behaviors and general knowledge"
    training:
      strategy: knowledge_embedding
      data_scopes: [documents]

  - name: coding
    scope: domain
    description: "Software engineering behaviors"
    training:
      strategy: corrective_sft
      data_scopes: [sessions, feedback]

  # Composite user adapter: weights per component + overall gain.
  # Compiled offline (ΔW = Σ wᵢ·ΔWᵢ, then ×gain) into one named artifact.
  - name: default-agent
    scope: user
    trainable: false
    composite:
      gain: 1.25
      merge: weighted_linear
      components:
        - adapter: general
          weight: 1.0
        - adapter: coding
          weight: 0.7

# User → adapter mapping (file-based for MVP)
users:
  - id: "default"
    adapters:
      inference: "default-agent@latest"
      training: "general"

# Inference service
inference:
  port: 8000
  gpu_node: "local"
  max_loras: 4
  max_cpu_loras: 32
  systemone:
    enabled: true

# Training service
training:
  port: 8001
  gpu_node: "local"
  methods:
    knowledge_embedding:
      enabled: true
      sequence_len: 4096
    corrective_sft:
      enabled: true
      sequence_len: 4096
    weighted_kto:
      enabled: true
      reward_range: [-3, 3]
      magnitude_weights:
        1: 0.5
        2: 1.0
        3: 1.5

# Security — pluggable auth. Default fail-closed: with dev_mode false and no
# api_tokens, HTTP API routes reject unauthenticated requests (401). Token VALUES
# are never stored here; each entry names a secret resolved at runtime.
security:
  dev_mode: false
  # Map callers to bearer-token secrets. Populate for real deployments; the
  # shipped example is inert until SAIP_TOKEN_* secrets exist in the environment.
  api_tokens: []
  #  - caller: alice
  #    token_secret: SAIP_TOKEN_ALICE
  ui:
    admin_secret: SAIP_UI_ADMIN   # SECRET NAME guarding any web UI

# Cordis plugin loading
plugins: []
